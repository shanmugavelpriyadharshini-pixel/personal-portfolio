<style>
:root{--pink-50:#fff0f6;--pink-100:#ffe0ec;--pink-200:#ffc2d9;--pink-300:#ff9ec1;--pink-400:#ff6fa5;--pink-500:#ec4899;--pink-600:#db2777;--pink-900:#831843;
--bg:#fdf7fa;--card:#fff;--text:#3b1f2b;--muted:#6f5062;--line:#f3d3e1;--on-accent:#fff;--shadow:0 10px 30px rgba(219,39,119,.12);
--s1:4px;--s2:8px;--s3:16px;--s4:24px;--s5:48px;--s6:96px;--r:20px;
--font-d:'Fraunces',Georgia,serif;--font-b:'DM Sans',system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d0f17;--card:#2a1521;--text:#fbe9f1;--muted:#d3aabf;--line:#4a2638;--shadow:0 10px 30px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#1d0f17;--card:#2a1521;--text:#fbe9f1;--muted:#d3aabf;--line:#4a2638;--shadow:0 10px 30px rgba(0,0,0,.4)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--text);font:400 1rem/1.65 var(--font-b);overflow-x:hidden}
img{max-width:100%}
a{color:var(--pink-600)}
:root[data-theme="dark"] a,:root:not([data-theme="light"]) a{--l:var(--pink-300)}
:focus-visible{outline:3px solid var(--pink-500);outline-offset:3px;border-radius:6px}
.skip{position:absolute;left:-999px;top:8px;background:var(--pink-600);color:#fff;padding:8px 16px;border-radius:8px;z-index:100}
.skip:focus{left:8px}
h1,h2,h3{font-family:var(--font-d);line-height:1.15;margin:0}
h2{font-size:clamp(1.9rem,4vw,2.8rem);margin-bottom:var(--s4);color:var(--pink-600)}
:root[data-theme="dark"] h2{color:var(--pink-300)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) h2{color:var(--pink-300)}}
section{padding:var(--s6) var(--s3) var(--s5)}
.wrap{max-width:1040px;margin:0 auto}
.btn{display:inline-block;border:0;cursor:pointer;font:700 1rem var(--font-b);padding:12px 24px;border-radius:999px;text-decoration:none;transition:transform .2s}
.btn:hover{transform:translateY(-2px)}
.btn--solid{background:var(--pink-600);color:#fff}
.btn--ghost{background:transparent;color:var(--text);box-shadow:inset 0 0 0 2px var(--pink-400)}
/* nav */
.nav{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav__in{max-width:1040px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:12px var(--s3)}
.nav__logo{font:800 1.3rem var(--font-d);text-decoration:none;color:var(--pink-600)}
.nav__links{display:none;list-style:none;margin:0;padding:0;gap:var(--s3);align-items:center}
.nav__links a{text-decoration:none;color:var(--text);font-weight:500;padding:6px 10px;border-radius:999px}
.nav__links a.active{background:var(--pink-100);color:var(--pink-900)}
.nav__links.open{display:flex;flex-direction:column;position:absolute;top:100%;left:0;right:0;background:var(--bg);padding:var(--s3);border-bottom:1px solid var(--line)}
.icon-btn{background:none;border:1px solid var(--line);color:var(--text);width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:1.1rem}
@media(min-width:768px){.nav__links{display:flex}.burger{display:none}}
/* hero */
.hero{padding-top:var(--s5);min-height:80vh;display:flex;align-items:center;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;width:420px;height:420px;right:-120px;top:10%;background:radial-gradient(circle at 30% 30%,var(--pink-300),var(--pink-500));border-radius:50%;opacity:.35;animation:drift 12s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(-40px,40px) scale(1.1)}}
.hero__name{font-size:clamp(3rem,11vw,7rem);font-weight:800;letter-spacing:-.03em}
.hero__role{font:700 1.2rem var(--font-b);color:var(--pink-600);margin:var(--s3) 0 var(--s2)}
.hero p{max-width:52ch;color:var(--muted);font-size:1.15rem}
.hero__cta{display:flex;flex-wrap:wrap;gap:var(--s3);margin:var(--s4) 0}
.socials{display:flex;gap:var(--s3);flex-wrap:wrap;position:relative}
.socials a{color:var(--text);font-weight:500}
.hero__grid{display:grid;gap:var(--s4);align-items:center;position:relative}
.hero__photo{order:-1;width:min(220px,60vw);height:auto;aspect-ratio:1;object-fit:cover;border-radius:50%;border:6px solid var(--card);box-shadow:0 0 0 4px var(--pink-400),var(--shadow);justify-self:start}
.hero__grid .hero__name{font-size:clamp(2rem,9vw,3.6rem);overflow-wrap:anywhere}
@media(min-width:768px){.hero__grid{grid-template-columns:1.3fr 1fr}.hero__photo{order:0;width:min(340px,100%);justify-self:center}.hero__grid .hero__name{font-size:clamp(2rem,5vw,3.6rem)}}
/* cards */
.grid{display:grid;gap:var(--s4)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--s4);box-shadow:var(--shadow)}
.tags{display:flex;flex-wrap:wrap;gap:var(--s2);margin:var(--s3) 0 0;padding:0;list-style:none}
.tag{background:var(--pink-100);color:var(--pink-900);border-radius:999px;padding:2px 12px;font-size:.85rem;font-weight:500}
@media(min-width:768px){.grid--2{grid-template-columns:1fr 1fr}.grid--3{grid-template-columns:repeat(3,1fr)}}
.skill{margin-bottom:var(--s3)}
.skill__top{display:flex;justify-content:space-between;font-weight:500}
.bar{height:8px;background:var(--pink-100);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(135deg,var(--pink-400),var(--pink-600));border-radius:99px;transition:width 1s ease}
.proj__ph{height:150px;border-radius:14px;background:linear-gradient(135deg,var(--pink-200),var(--pink-500));display:grid;place-items:center;font:800 2.5rem var(--font-d);color:#fff;margin-bottom:var(--s3)}
.proj__links{display:flex;gap:var(--s2);margin-top:var(--s3)}
.proj__links .btn{padding:8px 16px;font-size:.9rem}
/* timeline */
.tl{list-style:none;margin:0;padding:0 0 0 24px;border-left:3px solid var(--pink-300)}
.tl li{position:relative;margin-bottom:var(--s4)}
.tl li::before{content:"";position:absolute;left:-34px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--pink-600);border:3px solid var(--bg)}
.tl small{color:var(--pink-600);font-weight:700}
:root[data-theme="dark"] .tl small{color:var(--pink-300)}
/* form */
label{display:block;font-weight:500;margin-bottom:var(--s3)}
input,textarea{width:100%;font:inherit;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--text);margin-top:4px}
.err{color:#c0123f;font-size:.85rem;min-height:1.1em;display:block}
:root[data-theme="dark"] .err{color:#ff9ab5}
.ok{background:var(--pink-100);color:var(--pink-900);padding:12px;border-radius:12px;margin-top:var(--s3)}
footer{text-align:center;padding:var(--s5) var(--s3) 120px;color:var(--muted)}
/* chatbot */
.cb-fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--pink-400),var(--pink-600));color:#fff;font-size:1.6rem;cursor:pointer;box-shadow:0 8px 24px rgba(219,39,119,.5);z-index:60;animation:pulse 2.5s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(236,72,153,.15)}}
.cb-hint{position:fixed;right:16px;bottom:88px;background:var(--card);border:1px solid var(--line);padding:8px 14px;border-radius:14px;box-shadow:var(--shadow);z-index:60;font-size:.9rem}
.cb{position:fixed;z-index:70;display:none;flex-direction:column;background:var(--card);inset:0;padding-top:env(safe-area-inset-top,0px)}
.cb.open{display:flex}
@media(min-width:600px){.cb{inset:auto 16px 16px auto;width:380px;height:560px;border-radius:var(--r);box-shadow:0 20px 50px rgba(131,24,67,.3);border:1px solid var(--line);overflow:hidden;padding-top:0}}
.cb__head{display:flex;align-items:center;gap:12px;padding:14px 16px;background:linear-gradient(135deg,var(--pink-500),var(--pink-600));color:#fff}
.cb__av{width:38px;height:38px;border-radius:50%;background:#fff;color:var(--pink-600);display:grid;place-items:center;font-weight:800}
.cb__head div{flex:1;line-height:1.2}.cb__head small{opacity:.9}
.cb__head button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:8px;padding:6px 10px;cursor:pointer}
.cb__msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.m{max-width:85%;padding:10px 14px;border-radius:16px;font-size:.95rem;line-height:1.5}
.m time{display:block;font-size:.7rem;opacity:.65;margin-top:2px}
.m--bot{background:var(--card);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.m--me{background:var(--pink-600);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.dots span{display:inline-block;width:7px;height:7px;margin:0 2px;border-radius:50%;background:var(--pink-400);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{50%{transform:translateY(-5px)}}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 16px;background:var(--bg)}
.chip{background:var(--pink-100);color:var(--pink-900);border:0;border-radius:999px;padding:6px 12px;cursor:pointer;font:500 .85rem var(--font-b)}
.chip:hover{background:var(--pink-200)}
.cb__in{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
.cb__in input{margin:0}
.cb__in button{background:var(--pink-600);color:#fff;border:0;border-radius:12px;padding:0 16px;font-weight:700;cursor:pointer}
.cb__in button:disabled{opacity:.4;cursor:not-allowed}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

const PROFILE = {

  tagline: "Turning ideas into intelligent digital experiences.",
  about: "I’m a first-year B.Sc. Computer Science (Generative AI) student at Rathinam Deemed To Be University in Coimbatore, Tamil Nadu. I enjoy programming, web development and exploring new technologies, with a strong interest in Artificial Intelligence and Generative AI.",

};

/* ============ Helpers ============ */
const $ = id => document.getElementById(id);
const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h !== undefined) e.innerHTML = h; return e; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} } };
const P = PROFILE, first = P.name.split(" ")[0];

/* ============ Render page from PROFILE ============ */
function renderPage(){
  $("h-name").textContent = P.name; $("h-role").textContent = P.role; $("h-tag").textContent = P.tagline;
  $("about-t").textContent = P.about; if (P.resume) $("resume").href = P.resume; else $("resume").style.display = "none";
  $("logo").textContent = P.name.split(/[\s.]+/).map(w => w[0]).join("");
  $("h-soc").innerHTML = Object.entries(P.socials).map(([k,v]) => `<a href="${esc(v)}" target="_blank" rel="noopener noreferrer">${esc(k)}</a>`).join("") + `<a href="mailto:${esc(P.contact.email)}">Email</a>`;
  $("skills-g").innerHTML = Object.entries(P.skills).map(([g,list]) => `<div class="card"><h3>${esc(g)}</h3><div style="margin-top:16px">${list.map(([n,l]) => `<div class="skill"><div class="skill__top"><span>${esc(n)}</span><span>${l}%</span></div><div class="bar"><i data-w="${l}"></i></div></div>`).join("")}</div></div>`).join("");
  $("proj-g").innerHTML = !P.projects.length ? `<div class="card"><h3>Projects coming soon</h3><p>I’m a first-year student and my first projects are in progress. Check back soon.</p></div>` : P.projects.map(p => `<article class="card"><div class="proj__ph" aria-hidden="true">${esc(p.name[0])}</div><h3>${esc(p.name)}</h3><p>${esc(p.desc)}</p><ul class="tags">${p.tech.map(t => `<li class="tag">${esc(t)}</li>`).join("")}</ul><div class="proj__links">${p.github ? `<a class="btn btn--ghost" href="${esc(p.github)}" target="_blank" rel="noopener noreferrer">GitHub</a>` : ""}${p.live ? `<a class="btn btn--solid" href="${esc(p.live)}" target="_blank" rel="noopener noreferrer">Live demo</a>` : ""}</div></article>`).join("");
  const tl = a => !a.length ? `<li><div style="color:var(--muted)">Nothing added yet. Coming soon.</div></li>` : a.map(i => `<li><small>${esc(i.years)}</small><h3 style="font-size:1.15rem">${esc(i.title)}</h3><div>${esc(i.where)}</div><div style="color:var(--muted)">${esc(i.note)}</div></li>`).join("");
  $("edu").innerHTML = tl(P.education); $("exp").innerHTML = tl(P.experience);
  const c = P.contact;
  $("contact-d").innerHTML = `<h3>Let’s talk</h3>${P.availability ? `<p>I’m ${esc(P.availability)}.</p>` : ""}<p><a href="mailto:${esc(c.email)}">${esc(c.email)}</a><br>${c.phone ? esc(c.phone) + "<br>" : ""}${esc(c.location)}</p>`;
  $("foot").textContent = `© ${new Date().getFullYear()} ${P.name}`;
  $("cb-name").textContent = P.name; $("cb-av").textContent = first[0];
}

/* ============ Page behavior: nav, theme, reveal, form ============ */
function initNav(){
  $("burger").onclick = () => { const o = $("links").classList.toggle("open"); $("burger").setAttribute("aria-expanded", o); };
  $("links").onclick = () => $("links").classList.remove("open");
  const links = [...document.querySelectorAll(".nav__links a")];
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) links.forEach(a => a.classList.toggle("active", a.getAttribute("href") === "#" + e.target.id)); }), {rootMargin:"-45% 0px -50% 0px"});
  document.querySelectorAll("main section").forEach(s => io.observe(s));
}
function initTheme(){
  const saved = store.get("theme"); if (saved) document.documentElement.dataset.theme = saved;
  $("theme").onclick = () => {
    const dark = document.documentElement.dataset.theme === "dark" || (!document.documentElement.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
    const next = dark ? "light" : "dark"; document.documentElement.dataset.theme = next; store.set("theme", next);
  };
}
function initBars(){
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.style.width = e.target.dataset.w + "%"; io.unobserve(e.target); } }), {threshold:.4});
  document.querySelectorAll(".bar i").forEach(b => io.observe(b));
}
function initForm(){
  /* Front-end only. To receive messages, set form action to a Formspree endpoint, or call EmailJS inside the success branch. */
  $("form").onsubmit = ev => {
    ev.preventDefault();
    const n = $("f-n").value.trim(), e = $("f-e").value.trim(), m = $("f-m").value.trim();
    $("e-n").textContent = n ? "" : "Enter your name.";
    $("e-e").textContent = /^\S+@\S+\.\S+$/.test(e) ? "" : "Enter a valid email address.";
    $("e-m").textContent = m.length >= 10 ? "" : "Write at least 10 characters.";
    if (n && /^\S+@\S+\.\S+$/.test(e) && m.length >= 10){ $("f-ok").innerHTML = `<div class="ok">Thanks, ${esc(n)}. Your message is ready to send.</div>`; $("form").reset(); }
    else $("f-ok").innerHTML = "";
  };
}

/* ============ Chatbot ============ */
const norm = s => s.toLowerCase().replace(/[^a-z0-9\s]/g, " ").replace(/\s+/g, " ").trim();
function lev(a,b){ const d = Array.from({length:a.length+1}, (_,i) => [i]); for (let j=1;j<=b.length;j++) d[0][j]=j;
  for (let i=1;i<=a.length;i++) for (let j=1;j<=b.length;j++) d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[a.length][b.length]; }
const fuzzy = (w,k) => w === k || (k.length >= 4 && w.length >= 4 && lev(w,k) <= (k.length > 7 ? 2 : 1));
const listJoin = a => a.length > 1 ? a.slice(0,-1).join(", ") + " and " + a[a.length-1] : a[0] || "";
const allSkills = () => Object.values(P.skills).flat().map(s => s[0]);
const projAbout = p => `<strong>${esc(p.name)}</strong>: ${esc(p.desc)} It solves this: ${esc(p.problem)} Built with ${esc(listJoin(p.tech))}.`;

const INTENTS = [
 {id:"greeting", kw:["hi","hello","hey","hii","namaste"], reply:() => `Hi! I’m ${esc(first)}’s virtual assistant. Ask me about my skills, projects, education or how to reach me. 😊`, chips:["Skills","Projects","Contact"]},
 {id:"thanks", kw:["thanks","thank","thx","tysm"], reply:() => "You’re welcome! Anything else you’d like to know?", chips:["Projects","Hire me"]},

 {id:"about", kw:["about","yourself","who","intro","introduce","background"], reply:() => esc(P.about), chips:["Skills","Projects","Resume"]},
 {id:"skills", kw:["skills","skill","technologies","tech","stack","tools","know","good"], reply:() => `My skills: ` + Object.entries(P.skills).map(([g,l]) => `<strong>${esc(g)}</strong> (${esc(listJoin(l.map(x => x[0])))})`).join("; ") + ".", chips:["Projects","Experience"]},
 {id:"projects", kw:["projects","project","built","made","portfolio","work","apps"], reply:() => !P.projects.length ? "I’m a first-year student and haven’t added projects yet. They’re coming soon!" : `I’ve built ${P.projects.length} main projects: ${listJoin(P.projects.map(p => esc(p.name)))}. Which one would you like details on?`, chips:P.projects.length ? P.projects.map(p => p.name) : ["Skills","Education"]},
 {id:"education", kw:["education","study","college","university","degree","cgpa","school","studied","qualification"], reply:() => P.education.map(e => `${esc(e.title)} at ${esc(e.where)} (${esc(e.years)}), ${esc(e.note)}.`).join(" "), chips:["Experience","Certifications"]},
 {id:"experience", kw:["experience","internship","intern","job","worked","career","achievements","hackathon"], reply:() => !P.experience.length ? "I’m a first-year student, so I haven’t added any experience or achievements yet." : P.experience.map(e => `<strong>${esc(e.title)}</strong>, ${esc(e.where)} (${esc(e.years)}): ${esc(e.note)}`).join("<br>"), chips:["Projects","Hire me"]},
 {id:"certs", kw:["certifications","certification","certificates","certificate","courses","certified"], reply:() => P.certifications.length ? `I’ve completed: ${esc(listJoin(P.certifications))}.` : "I haven’t added any certifications yet.", chips:["Education","Skills"]},
 {id:"contact", kw:["contact","email","mail","phone","reach","location","live","where","address","call"], reply:() => `You can email me at <a href="mailto:${esc(P.contact.email)}">${esc(P.contact.email)}</a>${P.contact.phone ? ", call " + esc(P.contact.phone) : ""}. I’m based in ${esc(P.contact.location)}.`, chips:["Social links","Resume"]},
 {id:"social", kw:["social","socials","linkedin","github","instagram","links","profiles"], reply:() => "Find me on: " + Object.entries(P.socials).map(([k,v]) => `<a href="${esc(v)}" target="_blank" rel="noopener noreferrer">${esc(k)}</a>`).join(", ") + ".", chips:["Contact","Projects"]},
 {id:"resume", kw:["resume","cv","curriculum"], reply:() => P.resume ? `Here’s my <a href="${esc(P.resume)}" target="_blank" rel="noopener noreferrer">resume</a>.` : "I haven’t added a resume yet. You can email me and I’ll share my details.", chips:["Contact","Experience"]},
 {id:"langs", kw:["language","languages","speak","tamil","english","spoken"], reply:() => `I speak ${esc(listJoin(P.languages))}.`, chips:["About","Contact"]},
 {id:"hire", kw:["hire","hiring","available","availability","opportunity","opportunities","freelance","recruit","job"], reply:() => `I’d love to hear from you. Email me at <a href="mailto:${esc(P.contact.email)}">${esc(P.contact.email)}</a> or call ${esc(P.contact.phone)}.`, chips:["Resume","Contact"]},
 {id:"hobbies", kw:["hobbies","hobby","interests","fun","free","passion"], reply:() => `My interests are ${esc(listJoin(P.hobbies))}.`, chips:["About","Projects"]}
];
const CHIP_MAP = {"skills":"skills","projects":"projects","education":"education","experience":"experience","contact":"contact","hire me":"hire","resume":"resume","about":"about","social links":"social","certifications":"certs"};

let lastTopic = null, history = [];
function detect(text){
  const t = norm(text), words = t.split(" ");
  // 1. specific project (by name or ordinal)
  const ords = {first:0,"1st":0,one:0,second:1,"2nd":1,two:1,third:2,"3rd":2,three:2};
  for (const [i,p] of P.projects.entries()){ if (t.includes(norm(p.name)) || norm(p.name).split(" ").some(w => w.length > 4 && words.some(x => fuzzy(x,w)))) return {id:"project", i}; }
  if (lastTopic && (lastTopic.id === "projects" || lastTopic.id === "project")) for (const w of words) if (w in ords && P.projects[ords[w]]) return {id:"project", i:ords[w]};
  // 2. specific skill ("do you know python")
  const sk = allSkills().find(s => norm(s).split(" ").some(w => w.length > 1 && words.some(x => fuzzy(x,w))));
  if (sk && /\b(know|use|using|used|experience|with|about|good|familiar|python|java|react|sql|node)\b/.test(t) || (sk && words.length <= 3)) return {id:"skill", name:sk};
  // 3. follow-ups
  if (/\b(more|detail|details|elaborate|explain)\b/.test(t) && lastTopic) return {id:"more"};
  // 4. keyword intents with fuzzy scoring
  let best = null, score = 0;
  for (const it of INTENTS){ let s = 0; for (const k of it.kw) if (words.some(w => fuzzy(w,k))) s++; if (s > score){ score = s; best = it; } }
  return best ? {id:best.id, intent:best} : null;
}
function respond(text){
  const m = detect(text);
  if (!m) return {html:"I don’t have that info, but I’d be happy to talk about my skills, projects or experience. You can also message me directly.", chips:["Skills","Projects","Contact"]};
  if (m.id === "project"){ lastTopic = {id:"project", i:m.i}; const p = P.projects[m.i]; return {html:projAbout(p), chips:["GitHub link","Other projects","Skills"], proj:p}; }
  if (m.id === "skill"){ const using = P.projects.filter(p => p.tech.some(t => norm(t).includes(norm(m.name).split(" ")[0]))); lastTopic = {id:"skills"};
    return {html:`${esc(m.name)} is part of my toolkit.` + (using.length ? ` I’ve used it in ${listJoin(using.map(p => esc(p.name)))}. Want details?` : ""), chips: using.length ? using.map(p => p.name).concat("All skills") : ["All skills","Projects"]}; }
  if (m.id === "more"){
    if (lastTopic.id === "project"){ const p = P.projects[lastTopic.i]; return {html:`${projAbout(p)} ${p.github ? `<a href="${esc(p.github)}" target="_blank" rel="noopener noreferrer">View the code</a>` : ""}${p.live ? ` or <a href="${esc(p.live)}" target="_blank" rel="noopener noreferrer">try the live demo</a>` : ""}.`, chips:["Other projects","Contact"]}; }
    return {html:"Happy to share more. Which area interests you most?", chips:["Skills","Projects","Experience"]};
  }
  const it = m.intent; lastTopic = {id:it.id};
  return {html:it.reply(), chips:it.chips};
}

/* Optional LLM upgrade. Disabled by default.
   WARNING: NEVER put API keys in front-end code. Call your own backend proxy
   (Netlify Function, Vercel route or Express) that holds the key and calls Claude/OpenAI/Gemini.
   Sample system prompt: */
const SYSTEM_PROMPT = () => `You are ${P.name}’s portfolio assistant. Answer in first person, in 2-3 friendly sentences, using ONLY this data: ${JSON.stringify(P)}. If the answer is not in the data, say you don’t have that info and offer the contact email.`;
const USE_AI = false;
async function getAIResponse(userMessage, hist){
  const res = await fetch("/api/chat", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({system:SYSTEM_PROMPT(), history:hist, message:userMessage})}); // your proxy endpoint
  return (await res.json()).reply;
}

const time = () => new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
function addMsg(html, who){ const m = el("div", "m m--" + who, html + `<time>${time()}</time>`); $("msgs").appendChild(m); $("msgs").scrollTop = $("msgs").scrollHeight; return m; }
function setChips(list){ const c = $("chips"); c.innerHTML = ""; list.forEach(t => { const b = el("button", "chip", esc(t)); b.onclick = () => send(t); c.appendChild(b); }); }
async function send(text){
  text = text.trim(); if (!text) return;
  addMsg(esc(text), "me"); $("cb-in").value = ""; $("cb-send").disabled = true; setChips([]); history.push({role:"user", content:text});
  const typing = el("div", "m m--bot dots", "<span></span><span></span><span></span>"); $("msgs").appendChild(typing); $("msgs").scrollTop = $("msgs").scrollHeight;
  await new Promise(r => setTimeout(r, 600 + Math.random() * 300));
  let out;
  if (USE_AI){ try{ out = {html:esc(await getAIResponse(text, history)), chips:["Skills","Projects","Contact"]}; }catch(e){ out = respond(text); } } else out = respond(text);
  // chip phrases that mean "show something": translate to intents
  typing.remove(); addMsg(out.html, "bot"); history.push({role:"assistant", content:out.html}); setChips(out.chips || []);
}
function chipQuery(t){ const k = t.toLowerCase(); if (k === "github link" && lastTopic && lastTopic.id === "project") return P.projects[lastTopic.i].name + " more"; if (k === "other projects" || k === "all skills") return k === "all skills" ? "skills" : "projects"; return t; }
function openChat(){ $("cb").classList.add("open"); $("hint").style.display = "none"; $("fab").style.display = "none"; if (!$("msgs").children.length) greet(); $("cb-in").focus(); }
function greet(){ addMsg(`Hi! I’m ${esc(first)}’s virtual assistant. Ask me about my skills, projects, education or how to reach me. 😊`, "bot"); setChips(["Skills","Projects","Education","Experience","Contact","Hire me"]); }
function initChat(){
  $("fab").onclick = openChat;
  $("cb-x").onclick = () => { $("cb").classList.remove("open"); $("fab").style.display = ""; };
  $("cb-clear").onclick = () => { $("msgs").innerHTML = ""; history = []; lastTopic = null; greet(); };
  $("cb-in").oninput = e => $("cb-send").disabled = !e.target.value.trim();
  $("cb-in").onkeydown = e => { if (e.key === "Enter") send($("cb-in").value); };
  $("cb-send").onclick = () => send($("cb-in").value);
  const origSend = send; // route chip labels through chipQuery
  window.send = send;
  $("chips").addEventListener("click", () => {}, true);
  setTimeout(() => { if (!$("cb").classList.contains("open")) $("hint").style.display = "block"; }, 2500);
  $("hint").style.display = "none";
}
/* Map chip labels to queries before they reach the matcher */
const _send = send; send = t => _send(chipQuery(t)); // eslint-disable-line no-func-assign

renderPage(); initNav(); initTheme(); initBars(); initForm(); initChat();
</script>
